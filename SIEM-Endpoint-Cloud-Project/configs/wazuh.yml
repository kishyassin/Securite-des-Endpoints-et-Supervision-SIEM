<!-- Integrity monitoring (syscheck) -->
<syscheck>
<frequency>43200</frequency>
<scan_on_start>yes</scan_on_start>
<scan_day>Saturday</scan_day>
<scan_time>3:00 am</scan_time>
<max_dir_complexity>50</max_dir_complexity>
<max_audit_entries_diff>256</max_audit_entries_diff>
<disk_quota_enabled>no</disk_quota_enabled>
<disk_quota_limit_mb>500</disk_quota_limit_mb>
<disk_quota_interval>cicle</disk_quota_interval>
<disk_quota_min_free_mb>50</disk_quota_min_free_mb>
<honor_echo_off>yes</honor_echo_off>

<!-- File/directory monitoring -->
<directories realtime="yes">/etc</directories>
<directories realtime="yes">/usr/bin</directories>
<directories realtime="yes">/usr/sbin</directories>
<directories realtime="yes">/root</directories>
<directories realtime="no">/boot</directories>

<!-- Exclusions -->
<ignore>/proc</ignore>
<ignore>/dev</ignore>
<ignore>/sys</ignore>
<ignore>/tmp</ignore>
</syscheck>

<!-- Rootkit detection -->
<rootcheck>
<rootkit_files>/var/ossec/etc/rootcheck/rootkit_files.txt</rootkit_files>
<rootkit_trojans>/var/ossec/etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
<check_dev>yes</check_dev>
<check_files>yes</check_files>
<check_if>yes</check_if>
<check_pids>yes</check_pids>
<check_ports>yes</check_ports>
<check_sys>yes</check_sys>
<check_trojans>yes</check_trojans>
<skip_nfs>yes</skip_nfs>
</rootcheck>

<!-- Audit monitoring -->
<localfile>
<log_format>audit</log_format>
<location>/var/log/audit/audit.log</location>
</localfile>

<!-- Syslog monitoring -->
<localfile>
<log_format>syslog</log_format>
<location>/var/log/messages</location>
</localfile>

<localfile>
<log_format>syslog</log_format>
<location>/var/log/auth.log</location>
</localfile>

<localfile>
<log_format>syslog</log_format>
<location>/var/log/secure</location>
</localfile>

<!-- Wazuh agent status monitoring -->
<localfile>
<log_format>json</log_format>
<location>/var/ossec/logs/wazuh.log</location>
</localfile>
## END OF CONFIGURATION
