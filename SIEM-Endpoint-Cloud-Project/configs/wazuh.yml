# Wazuh Server Configuration

## This file contains the main configuration for Wazuh Server
## Location: /var/ossec/etc/ossec.conf

## For production deployments, this should be customized based on:
## - Number of agents
## - Expected event volume
## - Storage capacity
## - Security requirements

# WAZUH MANAGER CONFIGURATION
# ==========================

<!-- Log settings -->
<global>
<jsonout_output>yes</jsonout_output>
<alerts_log>yes</alerts_log>
<logall>no</logall>
<logall_json>no</logall_json>
<integrity_monitoring>yes</integrity_monitoring>
<rootcheck>yes</rootcheck>
<syscheck>yes</syscheck>
<max_output_size>16384</max_output_size>
<response_timeout>1</response_timeout>
<compress_alerts>no</compress_alerts>
<compression_algorithm>zlib</compression_algorithm>
</global>

<!-- Alerts configuration -->
<alerts>
<log_alert_level>3</log_alert_level>
<email_notification>no</email_notification>
<smtp_server>smtp.example.com</smtp_server>
<email_from>wazuh@example.com</email_from>
<email_maxperhour>12</email_maxperhour>
<email_log_source>alerts.log</email_log_source>
<log_alert_level>3</log_alert_level>
</alerts>

<!-- Remote syslog server (optional) -->
<!--
<syslog_output>
<server>192.168.1.100</server>
<port>514</port>
<protocol>udp</protocol>
</syslog_output>
-->

<!-- RESTful API configuration -->
<api>
<enabled>yes</enabled>
<host>0.0.0.0</host>
<port>55000</port>
<https>yes</https>
<log_path>/var/ossec/logs/api.log</log_path>
</api>

<!-- Manager network settings -->
<remote>
<connection>secure</connection>
<port>1514</port>
<protocol>tcp</protocol>
<max_clients>300</max_clients>
<queue_size>131072</queue_size>
<!-- Auto enrollment -->
<enrollment>
<enabled>yes</enabled>
<manager_address>10.0.32.10</manager_address>
<port>1515</port>
<agent_auto_registration>yes</agent_auto_registration>
<agent_lifetime_seconds>3600</agent_lifetime_seconds>
<manager_cert>etc/ssl/certs/manager.crt</manager_cert>
<manager_key>etc/ssl/private/manager.key</manager_key>
<agent_cert>etc/ssl/certs/agent.crt</agent_cert>
</enrollment>
</remote>

